name: deploy
'on':
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.5
    - name: Terraform Format Check
      run: 'cd infra

        terraform fmt -check -recursive

        '
    - name: Terraform Validate
      run: 'cd infra

        terraform init -reconfigure -backend=false -input=false

        terraform validate

        '
  provision:
    runs-on: ubuntu-latest
    needs:
    - lint
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_vault_kms_key_alias: ${{ secrets.VAULT_KMS_KEY_ALIAS }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERTIFICATE_ARN }}
      TF_VAR_trusted_cidr: ${{ secrets.TRUSTED_CIDR }}
    timeout-minutes: 45
    outputs:
      alb_dns: ${{ steps.outputs.outputs.alb_dns }}
      bastion_ip: ${{ steps.outputs.outputs.bastion_ip }}
      vault_asg_name: ${{ steps.outputs.outputs.vault_asg_name }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.5
    - name: Terraform Init
      run: "cd infra\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
    - name: Terraform Plan
      run: 'cd infra

        terraform plan -input=false -out=tfplan

        '
    - id: apply
      name: Terraform Apply
      run: 'cd infra

        terraform apply -input=false tfplan

        '
    - id: outputs
      name: Get Outputs
      run: 'cd infra

        echo "alb_dns=$(terraform output -raw alb_dns_name)" >> "$GITHUB_OUTPUT"

        echo "bastion_ip=$(terraform output -raw bastion_public_ip)" >> "$GITHUB_OUTPUT"

        echo "vault_asg_name=$(terraform output -raw vault_asg_name)" >> "$GITHUB_OUTPUT"

        '
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_vault_kms_key_alias: ${{ secrets.VAULT_KMS_KEY_ALIAS }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERTIFICATE_ARN }}
      TF_VAR_trusted_cidr: ${{ secrets.TRUSTED_CIDR }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Install Ansible and AWS deps
      run: pip install ansible-core boto3 botocore
    - name: Install required Ansible collections
      run: 'ansible-galaxy collection install amazon.aws

        ansible-galaxy collection install community.general

        '
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        '
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    - name: Scan bastion known hosts
      run: ssh-keyscan -H "$BASTION_IP" >> ~/.ssh/known_hosts
      env:
        BASTION_IP: ${{ needs.provision.outputs.bastion_ip }}
    - id: resolve
      name: Resolve Vault node IPs via AWS CLI
      run: "VAULT_IPS=$(aws ec2 describe-instances \\\n  --filters \"Name=tag:aws:autoscaling:groupName,Values=$VAULT_ASG_NAME\"\
        \ \\\n            \"Name=instance-state-name,Values=running\" \\\n  --query\
        \ \"Reservations[*].Instances[*].PrivateIpAddress\" \\\n  --output text |\
        \ tr '\\t' '\\n')\necho \"vault_ips<<EOF\" >> \"$GITHUB_OUTPUT\"\necho \"\
        $VAULT_IPS\" >> \"$GITHUB_OUTPUT\"\necho \"EOF\" >> \"$GITHUB_OUTPUT\"\n"
      env:
        VAULT_ASG_NAME: ${{ needs.provision.outputs.vault_asg_name }}
        BASTION_IP: ${{ needs.provision.outputs.bastion_ip }}
    - name: Generate Ansible inventory
      run: "python3 - <<'PYEOF'\nimport os\nbastion = os.environ['BASTION_IP']\nvault_ips\
        \ = [ip.strip() for ip in os.environ['VAULT_IPS'].split('\\n') if ip.strip()]\n\
        user = os.environ['SSH_USER']\nlines = [\n    '[bastion]',\n    f'{bastion}\
        \ ansible_user={user} ansible_ssh_private_key_file=~/.ssh/deploy_key ansible_ssh_common_args=\"\
        -o StrictHostKeyChecking=accept-new\"',\n    '',\n    '[vault_servers]'\n\
        ]\nfor ip in vault_ips:\n    lines.append(f'{ip} ansible_user={user} ansible_ssh_private_key_file=~/.ssh/deploy_key\
        \ ansible_ssh_common_args=\"-o StrictHostKeyChecking=accept-new -o ProxyJump={user}@{bastion}\"\
        ')\nlines += ['', '[vault_servers:vars]', 'ansible_python_interpreter=/usr/bin/python3']\n\
        with open('ansible/inventory.ini', 'w') as f:\n    f.write('\\n'.join(lines)\
        \ + '\\n')\nprint(\"Inventory written\")\nPYEOF\n"
      env:
        BASTION_IP: ${{ needs.provision.outputs.bastion_ip }}
        VAULT_IPS: ${{ steps.resolve.outputs.vault_ips }}
        SSH_USER: ${{ secrets.SSH_USER }}
    - name: Run Vault configuration playbook
      run: "ansible-playbook -i ansible/inventory.ini ansible/site.yml \\\n  -e \"\
        vault_s3_bucket=$VAULT_S3_BUCKET\" \\\n  -e \"vault_dynamo_table=$VAULT_DYNAMO_TABLE\"\
        \ \\\n  -e \"vault_kms_key_id=$VAULT_KMS_KEY_ID\" \\\n  -e \"aws_region=us-east-1\"\
        \ \\\n  -e \"project_name=${{ secrets.PROJECT_NAME }}\" \\\n  --private-key\
        \ ~/.ssh/deploy_key \\\n  -v\n"
      env:
        VAULT_S3_BUCKET: ${{ secrets.VAULT_S3_BUCKET }}
        VAULT_DYNAMO_TABLE: ${{ secrets.VAULT_DYNAMO_TABLE }}
        VAULT_KMS_KEY_ID: ${{ secrets.VAULT_KMS_KEY_ID }}
  verify:
    runs-on: ubuntu-latest
    needs:
    - provision
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_vault_kms_key_alias: ${{ secrets.VAULT_KMS_KEY_ALIAS }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERTIFICATE_ARN }}
      TF_VAR_trusted_cidr: ${{ secrets.TRUSTED_CIDR }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.5
    - id: tf_out
      name: Read ALB DNS from Terraform outputs
      run: "cd infra\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\nALB_DNS=$(terraform\
        \ output -raw alb_dns_name)\necho \"alb_dns=$ALB_DNS\" >> \"$GITHUB_OUTPUT\"\
        \n"
    - name: Health-check Vault via ALB
      run: "echo \"Polling Vault API at https://$ALB_DNS/v1/sys/health ...\"\ncurl\
        \ --fail --retry 15 --retry-delay 20 --retry-all-errors \\\n  -k \"https://$ALB_DNS/v1/sys/health\"\
        \ \\\n  -o /dev/null -w \"HTTP %{http_code}\\n\"\n"
      env:
        ALB_DNS: ${{ steps.tf_out.outputs.alb_dns }}
    - name: Check Vault seal status
      run: "STATUS=$(curl -sk \"https://$ALB_DNS/v1/sys/health\" | \\\n  python3 -c\
        \ \"import sys,json; d=json.load(sys.stdin); print('sealed' if d.get('sealed')\
        \ else 'unsealed')\")\necho \"Vault seal status: $STATUS\"\n"
      env:
        ALB_DNS: ${{ steps.tf_out.outputs.alb_dns }}
